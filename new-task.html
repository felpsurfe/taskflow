<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cria uma nova tarefa no TaskFlow.">
  <title>TaskFlow — Nova tarefa</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Navegação principal">
      <a class="brand" href="index.html">TaskFlow</a>
      <div class="nav__links">
        <a href="index.html">Resumo</a>
        <a href="tasks.html">Tarefas</a>
        <a class="button button--small" href="new-task.html" aria-current="page">Nova tarefa</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <div class="container page-title__content">
        <div>
          <p class="eyebrow">Escrita no armazenamento</p>
          <h1>Criar uma tarefa</h1>
          <p>O formulário cria um objecto, junta-o ao array e guarda o array actualizado.</p>
        </div>
      </div>
    </section>

    <section class="container form-section" aria-labelledby="formTitle">
      <form id="newTaskForm" class="form-card" novalidate>
        <div class="section-heading">
          <p class="eyebrow">Novo registo</p>
          <h2 id="formTitle">Dados da tarefa</h2>
        </div>

        <div class="field">
          <label for="taskTitle">Título da tarefa</label>
          <input id="taskTitle" name="taskTitle" type="text" aria-describedby="titleError" autocomplete="off">
          <p id="titleError" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="taskCategory">Categoria</label>
          <select id="taskCategory" name="taskCategory">
            <option value="Estudo">Estudo</option>
            <option value="Projecto">Projecto</option>
            <option value="Pessoal">Pessoal</option>
          </select>
        </div>

        <div id="formFeedback" class="feedback" role="status" aria-live="polite" hidden>
          <span id="formFeedbackText"></span>
          <a id="viewTasksLink" href="tasks.html" hidden>Ver tarefas</a>
        </div>

        <div class="form-actions">
          <button class="button" type="submit">Guardar tarefa</button>
          <a class="button button--ghost" href="tasks.html">Cancelar</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p><strong>TaskFlow</strong> · dados fictícios guardados no browser.</p>
      <p>HTML · CSS · JavaScript</p>
    </div>
  </footer>
</body>
</html>
